<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PREPCORE — Study OS</title>
<style>
:root{
  --bg:#0A0A0F;--surf:#12121A;--card:#1A1A26;--brd:#252535;
  --pri:#6C63FF;--pri2:#8B85FF;
  --red:#FF6584;--teal:#4ECDC4;--purple:#9B59B6;--blue:#45B7D1;--ora:#FFB347;
  --txt:#FFFFFF;--t2:#8B8BA7;--t3:#4A4A6A;
  --ok:#2ECC71;--warn:#F39C12;--err:#E74C3C;
}
body.light{--bg:#F0F0F8;--surf:#FFFFFF;--card:#FFFFFF;--brd:#E0E0EE;--txt:#1A1A2E;--t2:#5A5A7A;--t3:#9A9AB0;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,'SF Pro Text','Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;transition:background .25s,color .25s}

/* SPLASH */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s,visibility .5s}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
.sp-box{width:80px;height:80px;border-radius:22px;background:rgba(108,99,255,.14);border:1px solid rgba(108,99,255,.28);display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:16px;animation:pop .7s cubic-bezier(.34,1.56,.64,1) forwards}
.sp-nm{font-size:26px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,#6C63FF,#8B85FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sp-sub{font-size:12px;color:var(--t2);margin-top:4px}
.sp-bar{width:56px;height:3px;background:var(--brd);border-radius:100px;margin-top:32px;overflow:hidden}
.sp-fill{height:100%;background:var(--pri);border-radius:100px;width:0;animation:load 1.9s ease forwards}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes load{0%{width:0}85%{width:100%}100%{width:100%}}

/* STREAM SELECT */
#stream-sel{position:fixed;inset:0;background:var(--bg);z-index:8000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;overflow-y:auto}
.str-card{width:100%;max-width:400px;background:var(--card);border:2px solid var(--brd);border-radius:18px;padding:20px;text-align:left;cursor:pointer;color:var(--txt);font-family:inherit;transition:border-color .2s,transform .15s;margin-bottom:12px;display:block}
.str-card:active{transform:scale(.985)}
.str-card.pcm:hover{border-color:var(--pri)}.str-card.pcb:hover{border-color:var(--ok)}

/* AUTH */
#auth{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:22px 18px;overflow-y:auto}
#auth.on{display:flex}
.a-logo{display:flex;flex-direction:column;align-items:center;margin-bottom:28px}
.a-icon{width:68px;height:68px;border-radius:20px;background:rgba(108,99,255,.14);border:1px solid rgba(108,99,255,.25);display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:12px}
.a-name{font-size:24px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,#6C63FF,#8B85FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.a-tag{font-size:12px;color:var(--t2);margin-top:3px}
.a-card{background:var(--card);border:1px solid var(--brd);border-radius:20px;padding:22px;width:100%;max-width:420px}
.a-title{font-size:19px;font-weight:700;margin-bottom:3px}
.a-sub{font-size:13px;color:var(--t2);margin-bottom:18px}
.a-err{display:none;background:rgba(231,76,60,.1);border:1px solid rgba(231,76,60,.28);border-radius:9px;padding:10px 12px;font-size:12px;color:var(--err);margin-bottom:13px;line-height:1.4}

/* APP */
#app{display:none;max-width:480px;margin:0 auto;min-height:100vh}
#app.on{display:block}
header{position:sticky;top:0;z-index:100;background:var(--bg);padding:12px 15px 9px;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between}
.logo{font-size:16px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,var(--pri),var(--pri2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdate{font-size:10px;color:var(--t2);margin-top:1px}
.h-av{width:33px;height:33px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;cursor:pointer;flex-shrink:0}
main{padding:13px 13px 78px}
.tab{display:none}.tab.on{display:block}

/* BOTTOM NAV — 7 TABS, SCROLLABLE */
#bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surf);border-top:1px solid var(--brd);display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#bnav::-webkit-scrollbar{display:none}
.ni{min-width:46px;flex:1;display:flex;flex-direction:column;align-items:center;padding:7px 3px 5px;cursor:pointer;border:none;background:none;color:var(--t3);font-size:7.5px;gap:2px;transition:color .2s;font-family:inherit;flex-shrink:0}
.ni.on{color:var(--pri)}.ni .ico{font-size:16px;line-height:1}

/* CARDS */
.card{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:14px;margin-bottom:11px}
.ct{font-size:10px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--t2);margin-bottom:10px}
.chdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:10px}
.sc{background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:12px}
.sv{font-size:21px;font-weight:700}.sl{font-size:10.5px;color:var(--t2);margin-top:1px}

/* PROGRESS */
.pb{background:var(--surf);border-radius:100px;overflow:hidden}
.pf{border-radius:100px;transition:width .55s ease}

/* RINGS */
.rw{display:inline-flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.rw svg{transform:rotate(-90deg)}
.rl{position:absolute;text-align:center}
.rp{font-size:12px;font-weight:700;line-height:1}
.ri{font-size:9px}

/* SUBJECTS */
.scrd{background:var(--card);border:1px solid var(--brd);border-radius:16px;margin-bottom:10px;overflow:hidden}
.shdr{display:flex;align-items:center;padding:13px;cursor:pointer;user-select:none;gap:11px}
.sico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sinf{flex:1;min-width:0}
.snm{font-size:13.5px;font-weight:600}
.smt{font-size:10.5px;color:var(--t2);margin-top:1px}
.schv{font-size:17px;color:var(--t3);transition:transform .25s;line-height:1;flex-shrink:0}
.scrd.op .schv{transform:rotate(90deg)}
.clist{display:none;border-top:1px solid var(--brd)}
.scrd.op .clist{display:block}
.chi{padding:11px 13px;border-bottom:1px solid var(--brd)}
.chi:last-child{border-bottom:none}
.chitop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.chnm{font-size:12px;font-weight:500;flex:1;margin-right:8px;line-height:1.35}
.chpct{font-size:11.5px;font-weight:700;color:var(--pri)}
.cks{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:7px}
.ck{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;background:var(--surf);border:1.5px solid var(--brd);border-radius:8px;padding:5px 2px;transition:all .12s;font-size:8.5px;color:var(--t2);text-align:center}
.ck .ci{font-size:13px}
.chbot{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.prb{font-size:9.5px;padding:2px 7px;border-radius:100px;font-weight:600;cursor:pointer}
.prb-H{background:rgba(255,101,132,.18);color:var(--red)}
.prb-M{background:rgba(255,179,71,.18);color:var(--ora)}
.prb-L{background:rgba(78,205,196,.18);color:var(--teal)}

/* TARGETS */
.ti{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--brd)}
.ti:last-child{border-bottom:none}
.tck{width:21px;height:21px;border-radius:50%;border:2px solid var(--t3);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .18s;font-size:10px}
.tck.dn{background:var(--pri);border-color:var(--pri);color:#fff}
.ti-inf{flex:1;min-width:0}
.ttl{font-size:12.5px;font-weight:500}
.ttl.dn{text-decoration:line-through;color:var(--t2)}
.tmt{font-size:10px;color:var(--t2);margin-top:2px}
.tdl{font-size:14px;color:var(--t3);cursor:pointer;padding:3px 5px;border:none;background:none}
.tag{font-size:9.5px;padding:1px 6px;border-radius:100px;font-weight:600}
.tl{background:rgba(69,183,209,.15);color:var(--blue)}.tn{background:rgba(108,99,255,.15);color:var(--pri)}
.tr{background:rgba(78,205,196,.15);color:var(--teal)}.tq{background:rgba(255,179,71,.15);color:var(--ora)}.tg{background:rgba(139,139,167,.15);color:var(--t2)}

/* QUIZ */
.qb{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--surf);border:1px solid var(--brd);border-radius:10px;padding:11px 12px;margin-bottom:7px;cursor:pointer;color:var(--txt);text-align:left}
.qsc{font-size:10px;padding:2px 7px;border-radius:100px;background:rgba(108,99,255,.15);color:var(--pri);font-weight:600}
.ob{display:block;width:100%;background:var(--surf);border:1.5px solid var(--brd);border-radius:9px;padding:10px 13px;margin-bottom:6px;cursor:pointer;color:var(--txt);text-align:left;font-size:12.5px;transition:all .12s;font-family:inherit}
.ob.sel{border-color:var(--pri);background:rgba(108,99,255,.12)}
.ob.cor{border-color:var(--ok);background:rgba(46,204,113,.12);color:var(--ok)}
.ob.wrg{border-color:var(--err);background:rgba(231,76,60,.09)}
.sqw{background:var(--surf);border:1px solid var(--brd);border-radius:10px;padding:12px;margin-bottom:10px}
.ans{background:rgba(46,204,113,.07);border:1px solid rgba(46,204,113,.22);border-radius:8px;padding:10px;font-size:11.5px;color:#a8f0c6;margin-top:8px;line-height:1.65}

/* STATUS */
.pill{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px}
.p-ok{background:rgba(46,204,113,.13);color:var(--ok)}
.p-wn{background:rgba(243,156,18,.13);color:var(--warn)}
.p-er{background:rgba(231,76,60,.13);color:var(--err)}

/* HEATMAP */
.hmap{display:grid;grid-template-columns:repeat(13,1fr);gap:2px}
.hc{aspect-ratio:1;border-radius:2px;background:var(--surf)}
.h1{background:rgba(108,99,255,.22)}.h2{background:rgba(108,99,255,.45)}.h3{background:rgba(108,99,255,.7)}.h4{background:var(--pri)}

/* BADGES */
.brow{display:flex;gap:7px;flex-wrap:wrap}
.bdg{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surf);border:1px solid var(--brd);border-radius:10px;padding:9px 7px 7px;min-width:58px;flex:1}
.bdg.ea{background:rgba(108,99,255,.1);border-color:var(--pri)}.bdg.lk{opacity:.28;filter:grayscale(1)}
.bio{font-size:20px}.bnm{font-size:8.5px;color:var(--t2);text-align:center;font-weight:600}.bsb{font-size:7.5px;color:var(--t3);text-align:center}

/* RC */
.rcr{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rcn{font-size:11px;width:84px;flex-shrink:0;color:var(--t2)}
.rct{flex:1;background:var(--surf);border-radius:100px;height:6px}
.rcf{height:6px;border-radius:100px;transition:width .6s}
.rcp{font-size:10.5px;font-weight:700;width:28px;text-align:right}

/* PROFILE */
.pcard{text-align:center;padding:20px 14px}
.pav{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;margin:0 auto 11px;border:3px solid rgba(108,99,255,.28)}
.pnm{font-size:19px;font-weight:700}.pem{font-size:11.5px;color:var(--t2);margin-top:2px}
.sw-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--brd)}
.tgl{position:relative;width:42px;height:23px}
.tgl input{opacity:0;width:0;height:0}
.sldr{position:absolute;inset:0;background:var(--brd);border-radius:100px;cursor:pointer;transition:.28s}
.sldr:before{content:'';position:absolute;width:17px;height:17px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.28s}
input:checked+.sldr{background:var(--pri)}
input:checked+.sldr:before{transform:translateX(19px)}
.ir{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid var(--brd);gap:9px}

/* MODALS */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:flex;align-items:flex-end;justify-content:center}
.msh{width:100%;max-width:480px;background:var(--surf);border-radius:20px 20px 0 0;padding:18px 17px 44px;max-height:90vh;overflow-y:auto;animation:su .28s ease}
@keyframes su{from{transform:translateY(36px);opacity:0}to{transform:translateY(0);opacity:1}}
.mhd{width:34px;height:4px;border-radius:2px;background:var(--brd);margin:0 auto 16px}
.mttl{font-size:16px;font-weight:700;margin-bottom:16px}
.ilbl{font-size:11px;color:var(--t2);margin-bottom:4px;display:block;font-weight:600}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--brd);border-radius:9px;padding:10px 12px;color:var(--txt);font-size:13px;outline:none;appearance:none;font-family:inherit;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
select option{background:var(--card)}.ig{margin-bottom:12px}

/* BUTTONS */
.btn{padding:11px 16px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .13s;font-family:inherit}
.btn:active{opacity:.72}
.btn-p{background:var(--pri);color:#fff;width:100%}
.btn-o{background:transparent;border:1.5px solid var(--brd);color:var(--txt)}
.btn-s{padding:6px 12px;font-size:11px;border-radius:7px}
.btn-r{background:rgba(231,76,60,.11);color:var(--err);border:1px solid rgba(231,76,60,.28)}
.btn-w{width:100%}
.fab{position:fixed;bottom:68px;right:max(13px,calc(50% - 227px));width:48px;height:48px;border-radius:50%;background:var(--pri);border:none;color:#fff;font-size:25px;cursor:pointer;z-index:150;box-shadow:0 4px 16px rgba(108,99,255,.42);display:none;align-items:center;justify-content:center}
.fab.on{display:flex}
.pl-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:13px}
.pl{padding:6px 12px;border-radius:100px;border:1.5px solid var(--brd);font-size:11.5px;font-weight:600;color:var(--t2);cursor:pointer;background:none;font-family:inherit}
.pl.on{border-color:var(--pri);background:rgba(108,99,255,.14);color:var(--pri)}

/* ═══ UNIT TEST / HISTORY STYLES ═══ */
.test-crd{background:var(--card);border:1px solid var(--brd);border-radius:14px;padding:14px;margin-bottom:10px}
.test-crd.urgent{border-color:rgba(231,76,60,.35)}
.test-crd.soon{border-color:rgba(243,156,18,.35)}
.cd-badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:100px}
.cd-red{background:rgba(231,76,60,.14);color:var(--err)}
.cd-ora{background:rgba(243,156,18,.14);color:var(--warn)}
.cd-ok{background:rgba(46,204,113,.14);color:var(--ok)}
.cd-neu{background:rgba(139,139,167,.14);color:var(--t2)}
.rdy-wrap{position:relative;height:7px;background:var(--surf);border-radius:100px;overflow:hidden;margin:6px 0}
.rdy-fill{height:100%;border-radius:100px;transition:width .6s}
.weak-item{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid var(--brd)}
.weak-item:last-child{border-bottom:none}
.weak-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.hist-item{padding:13px;background:var(--surf);border-radius:12px;margin-bottom:8px;border:1px solid var(--brd)}
.star-ico{font-size:14px;cursor:pointer}
.seg-wrap{display:flex;background:var(--surf);border-radius:10px;padding:3px;margin-bottom:13px;gap:2px}
.seg-btn{flex:1;padding:7px;border-radius:8px;border:none;font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;background:none;color:var(--t2);transition:all .2s}
.seg-btn.on{background:var(--pri);color:#fff}
.filter-banner{background:rgba(108,99,255,.1);border:1px solid rgba(108,99,255,.3);border-radius:12px;padding:10px 13px;margin-bottom:11px;display:flex;align-items:center;justify-content:space-between}
.ch-sel-row{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:9px;margin-bottom:3px;cursor:pointer;transition:background .12s;border:1px solid var(--brd)}
.ch-sel-row.on{background:rgba(108,99,255,.12);border-color:var(--pri)}
.graph-bar{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.graph-bar-fill{width:100%;border-radius:4px 4px 0 0;min-height:3px;transition:height .4s}
.imp-timeline{position:relative;padding-left:20px}
.imp-timeline::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:2px;background:var(--brd);border-radius:2px}
.tl-dot{position:absolute;left:0;width:14px;height:14px;border-radius:50%;border:2px solid var(--pri);background:var(--bg);top:3px}

/* MISC */
.emp{text-align:center;padding:22px 12px;color:var(--t2);font-size:12.5px}
.emp .ei{font-size:26px;margin-bottom:6px}
.lnk{color:var(--pri);cursor:pointer}
::-webkit-scrollbar{width:0}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="sp-box">📐</div>
  <div class="sp-nm">PREPCORE</div>
  <div class="sp-sub">PCM / PCB Study OS</div>
  <div class="sp-bar"><div class="sp-fill"></div></div>
</div>

<!-- AUTH -->
<div id="auth">
  <div class="a-logo">
    <div class="a-icon" id="a-ico">📐</div>
    <div class="a-name">PREPCORE</div>
    <div class="a-tag" id="a-tag">JEE & NEET Study OS</div>
  </div>
  <div class="a-card" id="a-card"></div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div><div class="logo">PREPCORE</div><div class="hdate" id="hdr-date"></div></div>
    <div class="h-av" id="h-av" onclick="go('profile')">?</div>
  </header>
  <main>
    <div class="tab on" id="tab-dashboard"></div>
    <div class="tab" id="tab-subjects"></div>
    <div class="tab" id="tab-targets"></div>
    <div class="tab" id="tab-quiz"></div>
    <div class="tab" id="tab-analytics"></div>
    <div class="tab" id="tab-tests"></div>
    <div class="tab" id="tab-profile"></div>
  </main>
  <nav id="bnav">
    <button class="ni on" data-t="dashboard" onclick="go('dashboard')"><span class="ico">🏠</span>Home</button>
    <button class="ni" data-t="subjects" onclick="go('subjects')"><span class="ico">📚</span>Subjects</button>
    <button class="ni" data-t="targets" onclick="go('targets')"><span class="ico">🎯</span>Targets</button>
    <button class="ni" data-t="quiz" onclick="go('quiz')"><span class="ico">✏️</span>Quiz</button>
    <button class="ni" data-t="analytics" onclick="go('analytics')"><span class="ico">📊</span>Stats</button>
    <button class="ni" data-t="tests" onclick="go('tests')"><span class="ico">🧪</span>Tests</button>
    <button class="ni" data-t="profile" onclick="go('profile')"><span class="ico">👤</span>Profile</button>
  </nav>
</div>

<!-- ADD TARGET MODAL -->
<div id="m-tgt" class="mov" style="display:none" onclick="cm('m-tgt',event)">
  <div class="msh">
    <div class="mhd"></div><div class="mttl">Add Target</div>
    <div class="ig"><label class="ilbl">Task</label><input id="t-task" placeholder="e.g. Complete Electrostatics notes"/></div>
    <div class="ig"><label class="ilbl">Category</label>
      <div class="pl-row" id="pc-cat">
        <button class="pl on" onclick="sp('pc-cat',this,'lecture')">📖 Lecture</button>

// ═══════════════════════════════ CALCULATIONS ════════════════════════════════
const chP=p=>!p?0:Math.round((p.lecture?35:0)+(p.notes?20:0)+(p.revision?25:0)+(p.questions?20:0));
const subP=sid=>{const s=ALL_SUBS.find(x=>x.id===sid);if(!s)return 0;const pr=gP();return Math.round(s.chapters.reduce((a,c)=>a+chP(pr[c.id]),0)/s.chapters.length)};
const totP=()=>{const subs=getActiveSubs();return Math.round(subs.reduce((a,s)=>a+subP(s.id),0)/subs.length)};
const totH=()=>Object.values(gS()).reduce((a,b)=>a+b,0);
function streak(){const h=gH(),d=new Date();let s=0;for(let i=0;i<366;i++){const k=new Date(d);k.setDate(k.getDate()-i);const key=k.toISOString().split('T')[0];if(h[key]&&h[key]>0)s++;else if(i>0)break;}return s;}
function mark(){const h=gH(),t=td();h[t]=(h[t]||0)+1;sv(K.HEAT(),h);chkBdg();}
function chkBdg(){const b=gB(),st=streak(),hr=totH();let ch=false;if(st>=7&&!b.includes('s7')){b.push('s7');ch=true}if(st>=15&&!b.includes('s15')){b.push('s15');ch=true}if(st>=30&&!b.includes('s30')){b.push('s30');ch=true}if(hr>=100&&!b.includes('h100')){b.push('h100');ch=true}if(ch)sv(K.BDG(),b);return b;}
function getRC(){
  const isPCB=getStream()==='pcb';const ph=subP('physics');const ch=Math.round((subP('chem_p')+subP('chem_o')+subP('chem_i'))/3);
  const third=isPCB?Math.round((subP('botany')+subP('zoology'))/2):subP('maths');
  const tLabel=isPCB?'Biology':'Mathematics';const tColor=isPCB?'#2ECC71':'#FFB347';
  const avg=Math.round((ph+ch+third)/3);
  const subs=[{n:'Physics',p:ph,c:'#FF6584'},{n:'Chemistry',p:ch,c:'#4ECDC4'},{n:tLabel,p:third,c:tColor}];
  const sorted=[...subs].sort((a,b)=>a.p-b.p);const weak=sorted[0],strong=sorted[2];
  const tips=[];if(weak.p<avg-5)tips.push(`${weak.n} is behind by ${avg-weak.p}% vs your average.`);if(weak.p<avg-5)tips.push(`Focus on ${weak.n} this week.`);if(strong.p>avg+10)tips.push(`${strong.n} is your strongest — keep it up!`);if(!tips.length)tips.push('Great balance across all subjects!');
  return{subs,avg,weak,strong,tips};
}
function getGuide(){
  const ex=gE();if(!ex.date)return null;
  const exam=new Date(ex.date),now=new Date();now.setHours(0,0,0,0);exam.setHours(0,0,0,0);
  const dLeft=Math.max(0,Math.round((exam-now)/86400000)),wLeft=Math.ceil(dLeft/7);
  const subs=getActiveSubs(),allCh=subs.reduce((a,s)=>a+s.chapters.length,0),pr=gP();
  const done=subs.reduce((a,s)=>a+s.chapters.filter(c=>chP(pr[c.id])>=100).length,0),rem=allCh-done;
  const cpw=wLeft>0?Math.ceil(rem/wLeft):rem;
  const active=Object.values(gH()).filter(v=>v>0).length,cpd=active>0?done/active:0;
  let status,sCls;
  if(cpd>0){const ratio=dLeft/Math.max(1,rem/cpd);if(ratio>=1.3){status='✅ On Track';sCls='p-ok'}else if(ratio>=0.8){status='⚠️ Slightly Behind';sCls='p-wn'}else{status='🚨 Needs Attention';sCls='p-er'}}
  else{const r=dLeft>0?rem/dLeft:99;if(r<=0.3){status='✅ On Track';sCls='p-ok'}else if(r<=0.7){status='⚠️ Slightly Behind';sCls='p-wn'}else{status='🚨 Needs Attention';sCls='p-er'}}
  return{dLeft,wLeft,done,allCh,rem,cpw,status,sCls,pct:Math.round((done/allCh)*100),name:ex.name};
}
function revReady(){const pr=gP(),r=[];getActiveSubs().forEach(s=>s.chapters.forEach(c=>{const p=pr[c.id]||{};if(p.lecture&&p.notes&&!p.revision)r.push({...c,sn:s.name,col:s.color})}));return r.slice(0,5);}

function daysUntil(dateStr){const d=new Date(dateStr),n=new Date();n.setHours(0,0,0,0);d.setHours(0,0,0,0);return Math.ceil((d-n)/86400000);}

function calcReadiness(chapters){
  if(!chapters||!chapters.length)return{pct:0,chapDone:0,notesDone:0,pyqDone:0,revDone:0,chapPend:[],notesPend:[],pyqPend:[]};
  const pr=gP();let ch=0,no=0,py=0,rv=0;const chapPend=[],notesPend=[],pyqPend=[];
  chapters.forEach(cid=>{
    const p=pr[cid]||{};const chObj=ALL_SUBS.flatMap(s=>s.chapters).find(c=>c.id===cid);const nm=chObj?.name||cid;
    if(p.lecture)ch++;else chapPend.push(nm);
    if(p.notes)no++;else notesPend.push(nm);
    if(p.questions)py++;else pyqPend.push(nm);
    if(p.revision)rv++;
  });
  const total=chapters.length*4,score=ch+no+py+rv;
  return{pct:Math.round((score/total)*100),chapDone:ch,notesDone:no,pyqDone:py,revDone:rv,total:chapters.length,chapPend,notesPend,pyqPend};
}

function readinessLabel(pct){if(pct>=75)return{lbl:'✅ Ready',cls:'p-ok'};if(pct>=50)return{lbl:'⚠️ Needs Revision',cls:'p-wn'};return{lbl:'🚨 Needs Attention',cls:'p-er'};}

function getWeakChaps(limit=7){
  const pr=gP(),scored=[];
  getActiveSubs().forEach(s=>s.chapters.forEach(c=>{
    const p=pr[c.id]||{};
    let score=0;if(!p.lecture)score+=4;if(!p.notes)score+=3;if(!p.questions)score+=3;if(!p.revision)score+=2;
    if(score>0)scored.push({...c,score,p,sn:s.name,col:s.color,icon:s.icon});
  }));
  return scored.sort((a,b)=>b.score-a.score).slice(0,limit);
}

function getWeakSuggestions(){
  const weak=getWeakChaps(5);if(!weak.length)return[];
  return weak.map(c=>{
    const p=c.p||{};
    if(!p.lecture)return{text:`${c.name} has not been started yet.`,col:'var(--err)',icon:'🔴'};
    if(!p.notes)return{text:`${c.name} — notes not completed.`,col:'var(--warn)',icon:'🟡'};
    if(!p.questions)return{text:`${c.name} has no PYQs completed.`,col:'var(--warn)',icon:'🟡'};
    if(!p.revision)return{text:`${c.name} has not been revised.`,col:'var(--blue)',icon:'🔵'};
    return{text:`${c.name} needs attention.`,col:'var(--t2)',icon:'⚪'};
  });
}

function renderHistory(){
  const hist=gTH().sort((a,b)=>new Date(b.date)-new Date(a.date));
  let h=`<div style="font-size:18px;font-weight:700;margin-bottom:11px;margin-top:3px">Unit Tests 🧪</div>
  <div class="seg-wrap"><button class="seg-btn" onclick="switchTestsView('upcoming')">📅 Upcoming</button><button class="seg-btn on" onclick="switchTestsView('history')">📜 History</button></div>`;

  if(!hist.length){h+=`<div class="emp"><div class="ei">📜</div>No test history yet.<br>Log results from Upcoming Tests.</div>`;document.getElementById('tab-tests').innerHTML=h;return;}

  // Stats
  const avgs=hist.map(h=>h.percentage);const avg=Math.round(avgs.reduce((a,b)=>a+b,0)/avgs.length);const best=Math.max(...avgs);const worst=Math.min(...avgs);
  h+=`<div class="card"><div class="ct">Performance Summary</div><div class="g3"><div class="sc" style="text-align:center;padding:10px"><div class="sv" style="color:var(--pri)">${avg}%</div><div class="sl">Average</div></div><div class="sc" style="text-align:center;padding:10px"><div class="sv" style="color:var(--ok)">${best}%</div><div class="sl">Best</div></div><div class="sc" style="text-align:center;padding:10px"><div class="sv" style="color:var(--err)">${worst}%</div><div class="sl">Lowest</div></div></div>`;

  // Improvement bar chart
  if(hist.length>1){
    const recent=[...hist].reverse().slice(-8);
    h+=`<div style="margin-top:11px"><div style="font-size:10px;color:var(--t2);font-weight:600;margin-bottom:7px">TREND (oldest → latest)</div><div style="display:flex;align-items:flex-end;gap:3px;height:55px">`;
    recent.forEach(item=>{const barH=Math.max(3,Math.round((item.percentage/100)*50));const col=item.percentage>=75?'var(--ok)':item.percentage>=50?'var(--warn)':'var(--err)';h+=`<div class="graph-bar"><div class="graph-bar-fill" style="height:${barH}px;background:${col}"></div><span style="font-size:7.5px;color:var(--t2)">${item.percentage}%</span></div>`;});
    h+='</div></div>';
  }
  h+='</div>';

  // Timeline
  h+=`<div style="font-size:10px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--t2);margin-bottom:10px">Test Timeline</div><div class="imp-timeline">`;
  hist.forEach((item,i)=>{
    const stars='★'.repeat(item.selfRating||0)+'☆'.repeat(5-(item.selfRating||0));
    const pCol=item.percentage>=75?'var(--ok)':item.percentage>=50?'var(--warn)':'var(--err)';
    h+=`<div style="position:relative;margin-bottom:14px;padding-left:14px"><div class="tl-dot" style="border-color:${pCol}"></div>
      <div class="hist-item">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px">
          <div><div style="font-size:13px;font-weight:700">${item.name}</div><div style="font-size:10.5px;color:var(--t2);margin-top:1px">📅 ${item.date}</div></div>
          <div style="text-align:right"><div style="font-size:18px;font-weight:800;color:${pCol}">${item.percentage}%</div><div style="font-size:10px;color:var(--t2)">${item.marksObtained}/${item.totalMarks}</div></div>
        </div>
        <div style="font-size:13px;color:var(--ora);margin-bottom:5px">${stars}</div>
        ${item.teacherRemarks?`<div style="font-size:10.5px;color:var(--t2);background:var(--surf);border-radius:7px;padding:7px;margin-bottom:5px">👩‍🏫 "${item.teacherRemarks}"</div>`:''}
        ${item.mistakesLearned?`<div style="font-size:10.5px;color:var(--blue);background:rgba(69,183,209,.07);border-radius:7px;padding:7px;margin-bottom:5px">💡 ${item.mistakesLearned}</div>`:''}
        <button class="btn btn-o btn-s btn-r" onclick="delHist_('${item.id}')">Delete</button>
      </div>
    </div>`;
  });
  h+='</div>';
  document.getElementById('tab-tests').innerHTML=h;
}

// ═══════════════════════════════════ ANALYTICS ═══════════════════════════════
function renderAnalytics(){
  const hr=totH(),h=gH(),pr=gP(),st=streak(),subs=getActiveSubs();
  const active=Object.values(h).filter(v=>v>0).length,avg=active?Math.round((hr/active)*10)/10:0;
  const allC=subs.reduce((a,s)=>a+s.chapters.length,0),dnC=subs.reduce((a,s)=>a+s.chapters.filter(c=>chP(pr[c.id])>=100).length,0);
  const ov=totP(),daily=gT().filter(x=>x.date===td()&&!x.wk),dp=daily.length?Math.round((daily.filter(x=>x.done).length/daily.length)*100):0;
  const base=new Date();let days=[];for(let i=90;i>=0;i--){const d=new Date(base);d.setDate(d.getDate()-i);const k=d.toISOString().split('T')[0];days.push({k,v:h[k]||0});}

    <div class="g2"><div class="sc"><div class="sv">${Math.round(hr*10)/10}h</div><div class="sl">Total Hours</div></div><div class="sc"><div class="sv">${active}</div><div class="sl">Active Days</div></div><div class="sc"><div class="sv">${avg}h</div><div class="sl">Avg/Day</div></div><div class="sc"><div class="sv">${gS()[td()]||0}h</div><div class="sl">Today</div></div></div>
    <div class="card"><div class="chdr"><div class="ct" style="margin:0">Study Heatmap</div><span style="font-size:10px;color:var(--t2)">13 weeks</span></div><div style="margin-top:5px">${hmap}</div><div style="display:flex;gap:4px;align-items:center;margin-top:7px;font-size:9px;color:var(--t3)">Less <div style="width:8px;height:8px;border-radius:2px;background:var(--surf)"></div><div class="hc h1" style="width:8px;height:8px;border-radius:2px"></div><div class="hc h2" style="width:8px;height:8px;border-radius:2px"></div><div class="hc h3" style="width:8px;height:8px;border-radius:2px"></div><div class="hc h4" style="width:8px;height:8px;border-radius:2px"></div> More</div><button class="btn btn-o btn-w" style="margin-top:11px" onclick="document.getElementById('h-hrs').value='';document.getElementById('m-hrs').style.display='flex'">+ Log Study Hours</button></div>
    <div class="card" style="border-color:rgba(108,99,255,.25)"><div class="ct">Insights</div><div style="display:flex;align-items:flex-start;gap:11px;margin-bottom:11px;padding-bottom:11px;border-bottom:1px solid var(--brd)"><span style="font-size:20px">💪</span><div><div style="font-size:10.5px;color:var(--t2);margin-bottom:1px">Strongest</div><div style="font-size:13.5px;font-weight:700">${rc.strong.n} — ${rc.strong.p}%</div></div></div><div style="display:flex;align-items:flex-start;gap:11px"><span style="font-size:20px">⚠️</span><div><div style="font-size:10.5px;color:var(--t2);margin-bottom:1px">Needs Attention</div><div style="font-size:13.5px;font-weight:700">${rc.weak.n} — ${rc.weak.p}%</div><div style="font-size:10.5px;color:var(--t2);margin-top:2px">Behind avg by ${Math.max(0,rc.avg-rc.weak.p)}%</div></div></div></div>
    <div class="card"><div class="ct">Subject Breakdown</div>${sbars}</div>
    <div class="card"><div class="ct">Activity Breakdown</div>${[{l:'Lectures',c:types.lecture,col:'#45B7D1',i:'📖'},{l:'Notes',c:types.notes,col:'#6C63FF',i:'📝'},{l:'Revisions',c:types.revision,col:'#4ECDC4',i:'🔄'},{l:'Questions',c:types.questions,col:'#FFB347',i:'❓'}].map(x=>`<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:12px">${x.i} ${x.l}</span><span style="font-size:11.5px;font-weight:700;color:${x.col}">${x.c}/${allC}</span></div>${pb(allC?Math.round((x.c/allC)*100):0,x.col,5)}</div>`).join('')}</div>`;
}
